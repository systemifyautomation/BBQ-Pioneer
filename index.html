    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BBQ Pioneer",
      "url": "https://bbqpioneer.com",
      "logo": "https://bbqpioneer.com/flame.svg",
      "description": "Premium high-ticket grills and smokers for the serious pitmaster.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-888-BBQ-FIRE",
        "contactType": "customer service"
      },
      "sameAs": [
        "https://www.facebook.com/bbqpioneer",
        "https://www.instagram.com/bbqpioneer",
        "https://www.youtube.com/bbqpioneer"
      ]
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BBQ Pioneer",
      "url": "https://bbqpioneer.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://bbqpioneer.com/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
